<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Game Leaderboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">

</head>
<body>
    <div class="game-container">
        <header>
            <h1>🎮 DYNAMIC MULTIPLAYER LEADERBOARD</h1>
            <p>Real-time Rankings | Live Updates | Tournament Mode</p>
        </header>

        <div class="main-dashboard">
            <!-- Left Panel: Top Players -->
            <div class="panel top-players-panel">
                <div class="panel-header">
                    <h2>🏆 TOP PLAYERS</h2>
                    <div class="live-indicator">
                        <span class="dot"></span>
                        LIVE
                    </div>
                </div>
                <div class="player-list" id="top-players">
                    <!-- Populated by JavaScript -->
                </div>
            </div>

            <!-- Center Panel: Main Leaderboard -->
            <div class="panel leaderboard-panel">
                <div class="panel-header">
                    <h2>📊 LIVE LEADERBOARD</h2>
                    <div class="search-box">
                        <input type="text" id="search-player" placeholder="Search player...">
                    </div>
                </div>
                <div class="leaderboard-table">
                    <table>
                        <thead>
                            <tr>
                                <th>Rank</th>
                                <th>Player</th>
                                <th>Score</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-body">
                            <!-- Populated by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Right Panel: Recent Activity & Controls -->
            <div class="panel activity-panel">
                <div class="panel-header">
                    <h2>🕐 RECENT ACTIVITY</h2>
                </div>
                <div class="activity-feed" id="activity-feed">
                    <!-- Populated by JavaScript -->
                </div>
                
                <div class="control-panel">
                    <h3>Game Controls</h3>
                    <div class="button-group">
                        <button id="add-player-btn" class="btn primary">➕ Add Player</button>
                        <input type="text" id="newPlayerName" placeholder="Enter username">
<input type="number" id="newPlayerScore" placeholder="Score">
<button onclick="addPlayer()">Add Player</button>

                        <button id="simulate-update-btn" class="btn success">🎲 Simulate Update</button>
                        <button id="refresh-btn" class="btn secondary">🔄 Refresh</button>
                    </div>
                    
                    <div class="stats-box">
                        <h4>Quick Stats</h4>
                        <div id="quick-stats">
                            <p>Total Players: <span id="total-players">0</span></p>
                            <p>Top Score: <span id="top-score">0</span></p>
                            <p>Avg Score: <span id="avg-score">0</span></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add Player Modal -->
        <div id="player-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Add New Player</h2>
                <form id="add-player-form">
                    <div class="form-group">
                        <label for="player-name">Username:</label>
                        <input type="text" id="player-name" required>
                    </div>
                    <div class="form-group">
                        <label for="initial-score">Initial Score:</label>
                        <input type="number" id="initial-score" value="1000" min="0">
                    </div>
                    <button type="submit" class="btn primary">Add Player</button>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
